  @media (prefers-color-scheme: dark) { body::before { opacity: .09; } }
  header { background: linear-gradient(135deg, #06893f, #1d3f7a); color: #fff;
    padding: 26px 16px 22px; text-align: center; }
  header .logo { width: 88px; height: 88px; border-radius: 50%; background: #fff; display: block;
    padding: 13px; box-sizing: border-box; object-fit: contain;
    margin: 0 auto 10px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  header h1 { margin: 0; font-size: 1.45rem; }
  header p { margin: 6px 0 0; opacity: .9; font-size: .95rem; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }

  /* filtri e viste */
  .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 4px; margin: 0 auto 10px; max-width: 420px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--text); padding: 9px 8px;
    border-radius: 999px; font-size: .95rem; font-weight: 600; cursor: pointer; }
  .seg button.active { background: var(--text); color: var(--bg); }
  .seg.views button.active { background: var(--accent); color: #fff; }

  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0 6px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 4px; text-align: center; }
  .stat .n { font-size: 1.35rem; font-weight: 800; }
  .stat .l { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }

  h2 { font-size: .95rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
    margin: 24px 0 12px; }

  /* card partita */
  .match { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin-bottom: 12px; border-left: 5px solid var(--line); }
  .match.pgs { border-left-color: var(--pgs); }
  .match.fipav { border-left-color: var(--fipav); }
  .match.next { box-shadow: 0 0 0 2px var(--accent); }
  .meta { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); }
  .badge { font-weight: 700; font-size: .7rem; padding: 2px 8px; border-radius: 6px; letter-spacing: .5px; }
  .badge.pgs { background: var(--pgs-bg); color: var(--pgs-text); }
  .badge.fipav { background: var(--fipav-bg); color: var(--fipav-text); }
  .badge.next { background: var(--accent); color: #fff; }
  .badge.win { background: var(--win); color: #fff; }
  .badge.lose { background: var(--lose); color: #fff; }
  .badge.live { background: var(--accent); color: #fff; animation: pulsa 1.4s ease-in-out infinite; }
  @keyframes pulsa { 50% { opacity: .45; } }
  .set.live { border-style: dashed; border-color: var(--accent); color: var(--accent); }
  .aggiornato { text-align: center; font-size: .78rem; color: var(--muted); margin: 8px 0 0; min-height: 1em; }
  .where { margin-left: auto; }
  .row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin: 10px 0 8px; }
  .team { font-weight: 600; font-size: .88rem; }
  .team.home { text-align: right; }
  .team.me { color: var(--accent); }
  .center { font-size: 1.4rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .center.time { font-size: .95rem; font-weight: 700; color: var(--muted); }
  .sets { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .set { font-size: .85rem; font-variant-numeric: tabular-nums; border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; }
  .set b { color: var(--accent); }
  .warn { font-size: .78rem; color: var(--lose); text-align: center; margin-top: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 16px 0; }
  .campo { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding-top: 10px;
    border-top: 1px dashed var(--line); font-size: .8rem; color: var(--muted); }
  .campo span { flex: 1; }
  .naviga { flex: none; background: var(--fipav); color: #fff; text-decoration: none; font-weight: 700;
    font-size: .82rem; padding: 8px 14px; border-radius: 999px; }

  /* calendario */
  .legend { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; font-size: .78rem;
    color: var(--muted); margin: 16px 0 4px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .legend i.dot { width: 8px; height: 8px; border-radius: 50%; }
  .month { margin-top: 18px; }
  .month h3 { position: sticky; top: 0; z-index: 2; margin: 0; padding: 10px 2px 8px;
    background: color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px); font-size: 1.05rem; border-radius: 0 0 10px 10px; }
  .month h3 small { color: var(--muted); font-weight: 500; font-size: .8rem; margin-left: 6px; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .dow { text-align: center; font-size: .7rem; font-weight: 700; color: var(--muted); padding: 2px 0 4px; }
  .cell { position: relative; aspect-ratio: 1 / 1.15; border-radius: 9px; background: var(--empty-cell);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-top: 5px; font-size: .82rem; color: var(--muted); border: 0; font-family: inherit; }
  .cell.blank { background: transparent; }
  .cell.today { outline: 2px solid var(--accent); outline-offset: -2px; color: var(--text); font-weight: 700; }
  .cell.has { cursor: pointer; font-weight: 700; }
  .cell.pgs { background: var(--pgs); color: var(--pgs-ink); }
  .cell.fipav { background: var(--fipav); color: var(--fipav-ink); }
  .cell.dim { opacity: .28; }
  .cell .info { font-size: .66rem; font-weight: 700; margin-top: auto; margin-bottom: 5px;
    font-variant-numeric: tabular-nums; }
  .cell .ha { font-size: .6rem; font-weight: 600; opacity: .85; }
  .cell .esito { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%;
    box-shadow: 0 0 0 1.5px #fff; }
  .esito.win { background: var(--win); }
  .esito.lose { background: var(--lose); }
  .esito.live { background: var(--accent); }
  .foglio .in-corso { color: var(--accent, #ff6b1a); }
  body.retro .aggiornato { font-size: 1rem; text-transform: uppercase; }

  /* pannello dettaglio */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--bg);
    border-radius: 18px 18px 0 0; padding: 10px 16px 24px; max-height: 80vh; overflow-y: auto;
    transform: translateY(100%); visibility: hidden; transition: transform .22s ease, visibility 0s .22s;
    max-width: 760px; margin: 0 auto; }
  .sheet.open { transform: translateY(0); visibility: visible; transition: transform .22s ease; }
  .backdrop.open { display: block; }
  .sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 10px; }
  .sheet .close { display: block; width: 100%; margin-top: 4px; padding: 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: .95rem; font-weight: 600; }

  footer { text-align: center; color: var(--muted); font-size: .8rem; padding-bottom: 24px; }
  @media (min-width: 600px) {
    header h1 { font-size: 1.8rem; }

    .center.time { font-size: 1.1rem; }
    .cell { aspect-ratio: 1 / .85; font-size: .95rem; }
    .cell .info { font-size: .78rem; }
    .cell .ha { font-size: .7rem; }
  }
  /* ================= MODALITÀ RETRO (matite colorate) ================= */
  header { position: relative; }
  .retro-toggle { position: absolute; top: 10px; right: 10px; display: inline-flex; align-items: center; gap: 6px;
    border: 1.5px solid rgba(255,255,255,.7); background: rgba(255,255,255,.15); color: #fff;
    padding: 5px 10px; border-radius: 999px; font: 700 .72rem system-ui, sans-serif; letter-spacing: .6px;
    cursor: pointer; text-transform: uppercase; }
  .retro-toggle b { background: rgba(0,0,0,.25); padding: 1px 6px; border-radius: 999px; }
  #retro-agenda { display: none; }

  body.retro {
    --bg: #fbfaf6; --card: #fffefb; --text: #2c2c2c; --muted: #6f6f6f; --line: #a3a3a3;
    --empty-cell: transparent; --blu: #2f4bb5; --rosso: #e0675c; --grigio: #8c8c8c;
    --pgs: #f2c200; --fipav: #2f4bb5;
    font-family: "Schoolbell", "Comic Sans MS", cursive; color: var(--text); background: var(--bg);
  }
  body.retro::before { display: none; }
  body.retro .matita { filter: url(#matita); }
  body.retro header { background: var(--bg); color: var(--blu); padding-top: 34px; }
  body.retro header h1 { font-weight: 400; font-size: 1.75rem; text-wrap: balance; text-transform: uppercase; letter-spacing: 1px; }
  body.retro header p { color: var(--rosso); opacity: 1; text-transform: uppercase; font-size: 1.05rem; }
  body.retro header .logo { box-shadow: none; border: 2px solid var(--blu); }
  body.retro .retro-toggle { border-color: var(--blu); color: var(--blu); background: transparent;
    font-family: inherit; font-size: .95rem; font-weight: 400; }
  body.retro .retro-toggle b { background: var(--rosso); color: #fff; font-weight: 400; }

  body.retro .seg { background: transparent; border: 2px solid var(--grigio); border-radius: 6px; }
  body.retro .seg button { font-family: inherit; font-weight: 400; font-size: 1.15rem; text-transform: uppercase;
    border-radius: 3px; color: var(--text); }
  body.retro .seg button.active, body.retro .seg.views button.active { color: var(--blu); background:
    repeating-linear-gradient(-35deg, rgba(47,75,181,.22) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 2px var(--blu); }
  body.retro .stat { background: transparent; border: 2px solid var(--grigio); border-radius: 4px; }
  body.retro .stat .n { font-weight: 400; font-size: 1.7rem; }
  body.retro .stat .l { font-size: .85rem; color: var(--text); }
  body.retro h2 { color: var(--blu); font-size: 1.2rem; font-weight: 400; }

  /* foglio a righe come la tabella disegnata */
  body.retro #retro-agenda { display: block; }
  body.retro #risultati, body.retro #prossime { display: none; }
  .foglio { width: 100%; border-collapse: collapse; text-transform: uppercase; margin-top: 18px; table-layout: fixed; }
  .foglio th { padding: 0 3px 12px; font-weight: 400; text-align: left; overflow: hidden; }
  .foglio th span { display: inline-block; border: 2px solid var(--blu); padding: 2px 5px 0; font-size: 1rem;
    color: #555; letter-spacing: 1.5px; }
  .foglio th:nth-child(odd) span { transform: rotate(-1.2deg); }
  .foglio th:nth-child(even) span { transform: rotate(.8deg); }
  .foglio th:last-child span { border-color: #555; }
  .foglio td { padding: 9px 4px 5px; font-size: 1.25rem; line-height: 1.1; border-bottom: 3px solid var(--c);
    color: var(--c); white-space: nowrap; overflow: hidden; text-overflow: clip; vertical-align: bottom; }
  .foglio th + th, .foglio td + td { border-left: 2px solid var(--grigio); }
  .foglio td.ora, .foglio td.punti { text-align: center; }
  .foglio td.camp { text-align: center; }
  .foglio tr.riga { cursor: pointer; }
  .foglio tr.dopo td { color: color-mix(in srgb, var(--c) 92%, #000); }
  .foglio tr.prossima td { background: linear-gradient(transparent 52%, rgba(255,226,60,.6) 52%, rgba(255,226,60,.6) 88%, transparent 88%); }
  .foglio .w { color: #1f8a4c; }
  .foglio .l { color: #c0392b; }
  .foglio col.c-giorno { width: 26%; } .foglio col.c-paese { width: 27%; } .foglio col.c-ora { width: 16%; }
  .foglio col.c-camp { width: 15%; } .foglio col.c-punti { width: 16%; }
  .foglio th:nth-child(n+4) span { font-size: .82rem; letter-spacing: 0; padding: 2px 3px 0; }
  .foglio td.camp .pieno { font-size: .92rem; }
  .foglio .lungo { display: none; }
  .nota-retro { text-align: center; color: var(--muted); font-size: 1rem; margin-top: 14px; text-transform: uppercase; }

  /* calendario in retro: celle colorate a matita */
  body.retro .month h3 { background: var(--bg); font-weight: 400; font-size: 1.35rem; text-transform: uppercase; color: var(--blu); }
  body.retro .month h3 small { font-size: .95rem; }
  body.retro .dow { font-weight: 400; font-size: 1rem; color: #555; }
  body.retro .cell { border: 1.5px solid #c4c4c4; border-radius: 3px; font-family: inherit; font-size: 1rem; color: #555; }
  body.retro .cell.has { font-weight: 400; border-width: 2px; }
  body.retro .cell.pgs { color: #6a5200; border-color: #d9ad00;
    background: repeating-linear-gradient(-35deg, rgba(242,194,0,.75) 0 2px, rgba(242,194,0,.28) 2px 5px); }
  body.retro .cell.fipav { color: #1c2f7a; border-color: var(--blu);

  body.retro .cell .info { font-weight: 400; font-size: .85rem; }

  body.retro .match.pgs { border-left-color: var(--pgs); } body.retro .match.fipav { border-left-color: var(--fipav); }
  body.retro .meta, body.retro .team, body.retro .center, body.retro .set, body.retro .campo { font-family: inherit; }
  body.retro .team { font-weight: 400; font-size: 1.15rem; text-transform: uppercase; color: var(--blu); }
  body.retro .team.me { color: var(--rosso); }
  body.retro .center { font-weight: 400; }
  body.retro .badge { font-weight: 400; font-size: .85rem; border-radius: 3px; }
  body.retro .meta { font-size: .95rem; }
  body.retro .campo { font-size: 1rem; }
  body.retro .naviga, body.retro .sheet .close { font-family: inherit; font-weight: 400; font-size: 1.05rem; border-radius: 4px; }
  body.retro .sheet { background: var(--bg); }
  body.retro footer { font-size: 1rem; text-transform: uppercase; }

  @media (min-width: 600px) {
    .foglio .corto { display: none; } .foglio .lungo { display: inline; }
    .foglio td { font-size: 1.45rem; }
    .foglio th:nth-child(n+4) span { font-size: 1rem; letter-spacing: 1.5px; padding: 2px 5px 0; }
    .foglio td.camp .pieno { font-size: inherit; }
    .foglio col.c-giorno { width: 24%; } .foglio col.c-paese { width: 25%; } .foglio col.c-ora { width: 14%; }
    .foglio col.c-camp { width: 20%; } .foglio col.c-punti { width: 17%; }
  }
  /* classifica */
  .tab-classifica { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    border-left: 5px solid var(--line); }
  .tab-classifica.fipav { border-left-color: var(--fipav); }
  .tab-classifica.pgs { border-left-color: var(--pgs); }
  .classifica { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .9rem; }
  .classifica th { font-size: .7rem; text-transform: uppercase; letter-spacing: .4px; color: var(--muted);
    padding: 9px 4px; text-align: center; border-bottom: 1px solid var(--line); }
  .classifica td { padding: 9px 4px; text-align: center; border-bottom: 1px solid var(--line); }
  .classifica tr:last-child td { border-bottom: 0; }
  .classifica .sq { text-align: left; font-weight: 600; }
  .classifica .sq small { display: block; font-weight: 400; font-size: .7rem; color: var(--muted); }
  .classifica .pos { color: var(--muted); width: 26px; }
  .classifica .pt { font-weight: 800; font-size: 1rem; }
  .classifica .setcl { white-space: nowrap; }

  .fonte { font-size: .75rem; color: var(--muted); text-align: right; margin: 6px 4px 0; }

  body.retro .tab-classifica { border: 2px solid var(--grigio); border-radius: 4px; background: transparent; }
  body.retro .classifica { font-size: 1.1rem; text-transform: uppercase; }

  body.retro .fonte { font-size: .95rem; text-transform: uppercase; }
  /* Link rapido alla pagina di amministrazione */
  .admin-link { position: fixed; top: 12px; left: 12px; z-index: 10000; display: inline-block;
    padding: 8px 13px; border-radius: 7px; background: #153b72; color: #fff;

  @media (max-width: 480px) { .admin-link { top: 8px; left: 8px; padding: 7px 10px; font-size: 11px; } }
</style>

<script>
(async function () {
  document.getElementById("titolo").textContent = TITOLO;
  document.getElementById("sottotitolo").textContent = SOTTOTITOLO;
  document.title = TITOLO;

  const GIORNI = ["Dom", "Lun", "Mar", "Mer", "Gio", "Ven", "Sab"];
  const MESI = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const norm = s => s.trim().toUpperCase();
  const key = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;

  function parseData(s) {
    s = s.trim();
    const iso = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (iso) return new Date(+iso[1], +iso[2] - 1, +iso[3]);
    const m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
    if (!m) return null;
    let y = +m[3]; if (y < 100) y += 2000;
    return new Date(y, +m[2] - 1, +m[1]);
  }

  function parseRisultato(r) {
    r = (r || "").trim();
    if (!r) return null;
    let dichiarato = null, testo = r;
    const md = r.match(/^(\d)\s*-\s*(\d)\s*(?:\((.*)\))?\s*$/);
    if (md) { dichiarato = [+md[1], +md[2]]; testo = md[3] || ""; }
    const parziali = (testo.match(/\d+\s*-\s*\d+/g) || []).map(p => p.split("-").map(n => +n.trim()));
    // un set è chiuso a 25 (15 il quinto) con 2 punti di scarto; altrimenti è ancora in corso
    const chiuso = ([a, b], i) => Math.max(a, b) >= (i === 4 ? 15 : 25) && Math.abs(a - b) >= 2;
    const calc = [0, 0];
    parziali.forEach((s, i) => { if (chiuso(s, i)) calc[s[0] > s[1] ? 0 : 1]++; });
    parziali.forEach((s, i) => { s.live = !chiuso(s, i); });
    if (!dichiarato && !parziali.length) return null;
    const score = dichiarato || calc;
    const finita = score[0] === 3 || score[1] === 3;
    const nonTorna = dichiarato && parziali.length && (dichiarato[0] !== calc[0] || dichiarato[1] !== calc[1]);
    return { score, parziali, nonTorna, calc, finita };
  }

  let datiJSON;
  try {
    const response = await fetch("data/risultati.json?ts=" + Date.now() + "-" + Math.random().toString(36).slice(2), { cache: "reload", headers: { "Cache-Control": "no-cache", "Pragma": "no-cache" } });
    if (!response.ok) throw new Error("HTTP " + response.status);
    datiJSON = await response.json();
  } catch (error) {
    console.error("Errore caricamento data/risultati.json:", error);
    const avviso = document.createElement("p");
    avviso.textContent = "Impossibile caricare il calendario. Riprova più tardi.";
    avviso.style.cssText = "margin:20px;padding:14px;border-radius:10px;background:#fff1f1;color:#8b1d1d";
    document.body.prepend(avviso);
    return;
  }

  const partite = (Array.isArray(datiJSON.partite) ? datiJSON.partite : [])
    .map(p => {
      const d = parseData(String(p.data || ""));
      if (!d) return null;
      const sc = Number(p.setCasa || 0), so = Number(p.setOspite || 0);
      const parz = Array.isArray(p.punteggiSet) ? p.punteggiSet.filter(Boolean) : [];
      // con i set a 0-0 ma parziali presenti (partita appena iniziata) il punteggio si calcola dai parziali
      const risultato = (sc || so) ? `${sc}-${so}${parz.length ? " (" + parz.join(", ") + ")" : ""}` : parz.join(", ");
      return {
        d, ora: String(p.ora || ""), gara: String(p.gara || ""),
        camp: norm(String(p.competizione || "FIPAV")) === "PGS" ? "PGS" : "FIPAV",
        casa: String(p.squadraCasa || ""), ospite: String(p.squadraOspite || ""),
        ris: parseRisultato(risultato), campo: String(p.campo || "")
      };
    }).filter(Boolean).sort((a, b) => a.d - b.d);

  const me = norm(MIA_SQUADRA || "");
  const isMe = t => me && norm(t) === me;
  const inCasa = p => isMe(p.casa);

  function esito(p) {
    if (!p.ris) return "";
    if (!p.ris.finita) return "live";
    if (!me) return "";
    const [a, b] = p.ris.score;
    if (a === b) return "";
    const vinceCasa = a > b;
    if (isMe(p.casa)) return vinceCasa ? "win" : "lose";
    if (isMe(p.ospite)) return vinceCasa ? "lose" : "win";
    return "";
  }

  function card(p, isNext) {
    const cls = p.camp.toLowerCase();
    const dataTxt = `${GIORNI[p.d.getDay()]} ${String(p.d.getDate()).padStart(2, "0")}/${String(p.d.getMonth() + 1).padStart(2, "0")}/${String(p.d.getFullYear()).slice(2)}`;
    const e = esito(p);
    const where = me ? (isMe(p.casa) ? "🏠 Casa" : isMe(p.ospite) ? "🚌 Trasferta" : "") : "";
    let centro, sets = "", warn = "";
    if (p.ris) {
      const [a, b] = p.ris.score;
      centro = `<div class="center">${a} - ${b}</div>`;
      sets = p.ris.parziali.map(s => {
        const [x, y] = s;
        return s.live ? `<span class="set live" title="Set in corso">${x}-${y}</span>`
                      : `<span class="set">${x > y ? `<b>${x}</b>` : x}-${y > x ? `<b>${y}</b>` : y}</span>`;
      }).join("");
      if (p.ris.nonTorna) warn = `<div class="warn">⚠ ${a}-${b} non corrisponde ai parziali (${p.ris.calc[0]}-${p.ris.calc[1]})</div>`;
    } else {
      centro = `<div class="center time">ore ${esc(p.ora)}</div>`;
    }
    return `
      <article class="match ${cls} ${isNext ? "next" : ""}">
        <div class="meta">
          <span class="badge ${cls}">${p.camp}</span>
          ${isNext ? '<span class="badge next">PROSSIMA</span>' : ""}
          ${e ? `<span class="badge ${e}">${({ win: "VITTORIA", lose: "SCONFITTA", live: "IN CORSO" })[e]}</span>` : ""}
          <span>${dataTxt}${p.ris ? " · " + esc(p.ora) : ""} · Gara ${esc(p.gara)}</span>
          <span class="where">${where}</span>
        </div>
        <div class="row">
          <div class="team home ${isMe(p.casa) ? "me" : ""}">${esc(p.casa)}</div>
          ${centro}
          <div class="team ${isMe(p.ospite) ? "me" : ""}">${esc(p.ospite)}</div>
        </div>
        ${sets ? `<div class="sets">${sets}</div>` : ""}
        ${warn}
        ${p.campo ? `<div class="campo">
            <span>📍 ${esc(p.campo)}</span>
            <a class="naviga" target="_blank" rel="noopener"
               href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.campo)}">Naviga</a>
          </div>` : ""}
      </article>`;
  }

  const stato = { filtro: "TUTTE", vista: "agenda" };
  const passa = p => stato.filtro === "TUTTE" || p.camp === stato.filtro;

  function renderSummary(lista) {
    const giocate = lista.filter(p => p.ris && p.ris.finita);
    const v = giocate.filter(p => esito(p) === "win").length;
    const s = giocate.filter(p => esito(p) === "lose").length;
    document.getElementById("summary").innerHTML = `
      <div class="stat"><div class="n">${giocate.length}</div><div class="l">Giocate</div></div>
      <div class="stat"><div class="n" style="color:var(--win)">${v}</div><div class="l">Vinte</div></div>
      <div class="stat"><div class="n" style="color:var(--lose)">${s}</div><div class="l">Perse</div></div>
      <div class="stat"><div class="n">${lista.filter(p => !p.ris).length}</div><div class="l">Da giocare</div></div>`;
  }

  function renderAgenda(lista) {
    const giocate = lista.filter(p => p.ris).reverse();
    const daGiocare = lista.filter(p => !p.ris);
    document.getElementById("risultati").innerHTML = `<h2>Risultati</h2>` +
      (giocate.length ? giocate.map(p => card(p, false)).join("") : '<div class="empty">Nessun risultato ancora.</div>');
    document.getElementById("prossime").innerHTML = `<h2>Prossime partite</h2>` +
      (daGiocare.length ? daGiocare.map((p, i) => card(p, i === 0)).join("") : '<div class="empty">Stagione conclusa!</div>');
  }

  function renderCalendario() {
    const box = document.getElementById("vista-calendario");
    if (!partite.length) { box.innerHTML = '<div class="empty">Nessuna partita in calendario.</div>'; return; }

    const perGiorno = {};
    partite.forEach(p => (perGiorno[key(p.d)] = perGiorno[key(p.d)] || []).push(p));
    const oggi = key(new Date());

    const primo = partite[0].d, ultimo = partite[partite.length - 1].d;
    let html = `<div class="legend">
        <span><i style="background:var(--pgs)"></i>PGS</span>
        <span><i style="background:var(--fipav)"></i>FIPAV</span>
        <span><i class="dot" style="background:var(--win)"></i>Vinta</span>
        <span><i class="dot" style="background:var(--lose)"></i>Persa</span>
      </div>`;

    for (let m = new Date(primo.getFullYear(), primo.getMonth(), 1);
         m <= new Date(ultimo.getFullYear(), ultimo.getMonth(), 1);
         m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) {
      const y = m.getFullYear(), mo = m.getMonth();
      const offset = (new Date(y, mo, 1).getDay() + 6) % 7;   // lunedì = 0
      const giorni = new Date(y, mo + 1, 0).getDate();
      const nelMese = partite.filter(p => p.d.getFullYear() === y && p.d.getMonth() === mo && passa(p)).length;

      let celle = ["L","M","M","G","V","S","D"].map(g => `<div class="dow">${g}</div>`).join("");
      for (let i = 0; i < offset; i++) celle += `<div class="cell blank"></div>`;
      for (let g = 1; g <= giorni; g++) {
        const k = `${y}-${mo}-${g}`;
        const ps = perGiorno[k] || [];
        const cls = ["cell"];
        if (k === oggi) cls.push("today");
        if (!ps.length) { celle += `<div class="${cls.join(" ")}" ${k === oggi ? 'id="oggi"' : ""}>${g}</div>`; continue; }
        const p = ps[0];
        cls.push("has", p.camp.toLowerCase());
        if (!ps.some(passa)) cls.push("dim");
        const e = esito(p);
        const info = p.ris ? `${p.ris.score[0]}-${p.ris.score[1]}` : esc(p.ora);
        const ha = me ? (inCasa(p) ? "casa" : "trasf.") : "";
        celle += `<button class="${cls.join(" ")}" data-k="${k}" ${k === oggi ? 'id="oggi"' : ""}
                    aria-label="${g} ${MESI[mo]}: ${esc(p.casa)} - ${esc(p.ospite)}">
                    ${g}${e ? `<span class="esito ${e}"></span>` : ""}
                    <span class="info">${info}</span>${ha ? `<span class="ha">${ha}</span>` : ""}
                  </button>`;
      }
      html += `<section class="month" data-m="${y}-${mo}">
          <h3>${MESI[mo]} ${y}<small>${nelMese} ${nelMese === 1 ? "partita" : "partite"}</small></h3>
          <div class="grid">${celle}</div>
        </section>`;
    }
    box.innerHTML = html;
    if (document.body.classList.contains("retro")) box.querySelectorAll(".month h3, .grid, .legend").forEach(x => x.classList.add("matita"));
  }

  // ---------- modalità RETRO ----------
  const GG = ["D", "L", "M", "M", "G", "V", "S"];
  const MM = ["GEN","FEB","MAR","APR","MAG","GIU","LUG","AGO","SET","OTT","NOV","DIC"];
  const PENNE = ["#2f4bb5", "#e0675c", "#2e8b57", "#8a4fb8", "#e08a1e"];
  const PAESI_SQUADRE = [   // paese della società, se manca l'indirizzo del campo
    [/DOMANI/i, "Pessano"], [/CINISELLO/i, "Cinisello Balsamo"], [/PLESIOS/i, "Vimodrone"],
    [/AGRATE/i, "Agrate Brianza"], [/CONCOREZZO/i, "Concorezzo"] ];

  function abbrevia(t) {
    t = t.toUpperCase().trim();
    const w = t.split(/\s+/);
    if (w.length > 1) return w[0].length > 6 ? w[0].slice(0, 7) + "." : `${w[0]} ${w[1][0]}.`;
    return t.length > 8 ? t.slice(0, 6) + "." : t;
  }
  function paese(p) {
    if (inCasa(p)) return "VICO";
    const m = p.campo.match(/\b\d{5}\s+(.+)$/);
    if (m) return abbrevia(m[1]);
    const avv = isMe(p.casa) ? p.ospite : p.casa;
    const t = PAESI_SQUADRE.find(([re]) => re.test(avv));
    return t ? abbrevia(t[1]) : "";
  }

  function renderRetroAgenda(lista) {
    const prossima = lista.find(p => !p.ris);
    const visti = {};
    let mesePrec = null, ci = -1;
    const righe = lista.map(p => {
      const m = `${p.d.getFullYear()}-${p.d.getMonth()}`;
      if (m !== mesePrec) { ci++; mesePrec = m; }
      const c = PENNE[ci % PENNE.length];
      const camp = visti[p.camp] ? p.camp[0] : `<span class="pieno">${p.camp}</span>`; visti[p.camp] = true;
      const e = esito(p);
      const punti = p.ris ? `<span class="${({ win: "w", lose: "l", live: "in-corso" })[e] || ""}">${p.ris.score[0]}-${p.ris.score[1]}</span>` : "";
      return `<tr class="riga ${p === prossima ? "prossima" : ""}" data-k="${key(p.d)}" style="--c:${c}">
          <td>${GG[p.d.getDay()]} ${p.d.getDate()}-${MM[p.d.getMonth()]}</td>
          <td>${esc(paese(p))}</td>
          <td class="ora">${esc(p.ora)}</td>
          <td class="camp">${camp}</td>
          <td class="punti">${punti}</td>
        </tr>`;
    }).join("");
    document.getElementById("retro-agenda").innerHTML = lista.length ? `
      <table class="foglio matita">
        <colgroup><col class="c-giorno"><col class="c-paese"><col class="c-ora"><col class="c-camp"><col class="c-punti"></colgroup>
        <thead><tr>
          <th><span>Giorno</span></th><th><span>Paese</span></th><th><span>Ora</span></th>
          <th><span><span class="corto">Camp.</span><span class="lungo">Campionato</span></span></th>
          <th><span><span class="corto">Punti</span><span class="lungo">Punteggio</span></span></th>
        </tr></thead>
        <tbody>${righe}</tbody>
      </table>
      <p class="nota-retro">Tocca una riga per i dettagli</p>` : '<div class="empty">Nessuna partita.</div>';
  }

  // ---------- CLASSIFICA ----------
  const cacheClassifiche = {};
  const API_PGS = "https://volley.pgsmilano.org/api";
  function leggiPgs({ campionato, categoria, girone }) {
    const json = u => fetch(u, { cache: "no-store" }).then(r => r.ok ? r.json() : Promise.reject(r.status));
    return Promise.all([json(`${API_PGS}/classifiche/campionato/${campionato}`),
                        json(`${API_PGS}/iscrizioni/campionato/${campionato}/light`)])
      .then(([classifiche, iscritte]) => {
        const g = classifiche.find(x => x.categoria === categoria && String(x.girone) === String(girone));
        if (!g) return null;
        const nomi = Object.fromEntries(iscritte.map(x => [x.id || x._id, x.nomeSquadra]));
        const righe = [...g.squadre].sort((a, b) => a.ranking - b.ranking).map(s => ({
          squadra: nomi[s.squadraID] || "?", punti: s.punteggio,
          giocate: s.partiteVinte + s.partitePerse + (s.partitePareggiate || 0),
          vinte: s.partiteVinte, perse: s.partitePerse, setVinti: s.setVinti, setPersi: s.setPersi }));
        return { aggiornato: g.timeLastUpdated, girone: `Girone ${girone}`, url: "https://volley.pgsmilano.org/classifiche", righe };
      });
  }
  function caricaClassifica(c) {
    const k = c.file || c.camp, v = cacheClassifiche[k];
    if (v && Date.now() - v.t < 60000) return v.p;   // ricarica al massimo una volta al minuto
    const p = (c.pgs ? leggiPgs(c.pgs)
                     : fetch(`${c.file}?t=${Date.now()}`, { cache: "no-store" }).then(r => r.ok ? r.json() : null))
      .catch(() => null);
    cacheClassifiche[k] = { t: Date.now(), p };
    return p;
  }
  function tabellaClassifica(c, dati) {
    if (!dati || !dati.righe || !dati.righe.length)
      return `<h2>Classifica ${c.camp}</h2><div class="empty">Classifica ${c.camp} non ancora disponibile.</div>`;
    const quando = new Date(dati.aggiornato);
    const q = isNaN(quando) ? "" : quando.toLocaleString("it-IT", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    const righe = dati.righe.map((r, i) => {
      const noi = MIA_SOCIETA.test(`${r.squadra} ${r.societa || ""}`);
      return `<tr class="${noi ? "noi" : ""}">
          <td class="pos">${i + 1}</td>
          <td class="sq">${esc(r.squadra)}${r.societa && r.societa !== r.squadra ? `<small>${esc(r.societa)}</small>` : ""}</td>
          <td class="pt">${esc(r.punti)}</td><td>${esc(r.giocate)}</td><td>${esc(r.vinte)}</td><td>${esc(r.perse)}</td>
          <td class="setcl">${esc(r.setVinti)}-${esc(r.setPersi)}</td>
        </tr>`;
    }).join("");
    return `<h2>Classifica ${c.camp}${dati.girone ? ` · ${esc(dati.girone)}` : ""}</h2>
      <div class="tab-classifica ${c.camp.toLowerCase()}">
        <table class="classifica">
          <thead><tr><th>#</th><th class="sq">Squadra</th><th>Pt</th><th>G</th><th>V</th><th>P</th><th>Set</th></tr></thead>
          <tbody>${righe}</tbody>
        </table>
      </div>
      <p class="fonte">${q ? `Aggiornata ${q} · ` : ""}${dati.url ? `<a href="${esc(dati.url)}" target="_blank" rel="noopener">fonte ${c.camp}</a>` : ""}</p>`;
  }
  function renderClassifica() {
    const box = document.getElementById("vista-classifica");
    const scelte = CLASSIFICHE.filter(c => stato.filtro === "TUTTE" || c.camp === stato.filtro);
    box.innerHTML = '<div class="empty">Caricamento classifica…</div>';
    Promise.all(scelte.map(caricaClassifica)).then(tutti => {
      if (stato.vista !== "classifica") return;
      box.innerHTML = scelte.map((c, i) => tabellaClassifica(c, tutti[i])).join("");
      if (document.body.classList.contains("retro")) box.querySelectorAll("table, h2").forEach(x => x.classList.add("matita"));
    });
  }

  function render() {
    const lista = partite.filter(passa);
    renderSummary(lista);
    document.getElementById("vista-agenda").hidden = stato.vista !== "agenda";
    document.getElementById("vista-calendario").hidden = stato.vista !== "calendario";
    document.getElementById("vista-classifica").hidden = stato.vista !== "classifica";
    if (stato.vista === "classifica") return renderClassifica();
    if (stato.vista === "agenda") { renderAgenda(lista); renderRetroAgenda(lista); } else renderCalendario();
  }

  // dettaglio giorno (pannello dal basso)
  const sheet = document.getElementById("sheet"), backdrop = document.getElementById("backdrop");
  function apri(k) {
    const ps = partite.filter(p => key(p.d) === k);
    if (!ps.length) return;
    const prossima = partite.find(p => !p.ris);
    document.getElementById("sheet-body").innerHTML = ps.map(p => card(p, p === prossima)).join("");
    sheet.classList.add("open"); backdrop.classList.add("open");
  }
  function chiudi() { sheet.classList.remove("open"); backdrop.classList.remove("open"); }
  backdrop.addEventListener("click", chiudi);
  document.getElementById("sheet-close").addEventListener("click", chiudi);
  document.addEventListener("keydown", e => { if (e.key === "Escape") chiudi(); });
  document.getElementById("vista-calendario").addEventListener("click", e => {
    const c = e.target.closest(".cell.has"); if (c) apri(c.dataset.k);
  });
  document.getElementById("retro-agenda").addEventListener("click", e => {
    const r = e.target.closest("tr.riga"); if (r) apri(r.dataset.k);
  });

  // interruttore Retro (OFF di default, ricordato sul dispositivo)
  const btnRetro = document.getElementById("retro");
  function setRetro(on) {
    document.body.classList.toggle("retro", on);
    btnRetro.setAttribute("aria-pressed", on);
    btnRetro.querySelector("b").textContent = on ? "ON" : "OFF";
    document.querySelectorAll("header h1, header p, .summary, .month h3, .grid, .legend").forEach(x => x.classList.toggle("matita", on));
    try { localStorage.setItem("lvt-retro", on ? "1" : "0"); } catch (e) {}
  }
  btnRetro.addEventListener("click", () => {
    setRetro(!document.body.classList.contains("retro"));
    if (stato.vista === "calendario") render();
  });
  let retroIniziale = false;
  try { retroIniziale = localStorage.getItem("lvt-retro") === "1"; } catch (e) {}

  function segmento(id, attr, campo) {
    document.getElementById(id).addEventListener("click", ev => {
      const b = ev.target.closest("button"); if (!b) return;
      document.querySelectorAll(`#${id} button`).forEach(x => x.classList.toggle("active", x === b));
      const cambioVista = campo === "vista" && stato.vista !== b.dataset[attr];
      stato[campo] = b.dataset[attr];
      render();
      if (cambioVista && stato.vista === "calendario") {
        const ora = new Date();
        const sez = document.querySelector(`.month[data-m="${ora.getFullYear()}-${ora.getMonth()}"]`);
        if (sez) sez.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });
  }
  segmento("filters", "f", "filtro");
  segmento("views", "v", "vista");

  render();
  setRetro(retroIniziale);
  document.getElementById("footer").textContent = `${partite.length} partite in calendario`;

  // Se la pagina rimane aperta mentre si aggiornano i risultati, ricaricala
  // quando l'utente torna sulla scheda dopo almeno 30 secondi in background.
  let nascostaDa = 0;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) nascostaDa = Date.now();
    else if (nascostaDa && Date.now() - nascostaDa > 30000) window.location.reload();
  });

  // ultimo aggiornamento: data dell'ultima modifica dei risultati su GitHub
  (function () {
    const el = document.getElementById("aggiornato");
    const scrivi = d => {
      const g = d.toLocaleDateString("it-IT", { weekday: "short", day: "2-digit", month: "2-digit", year: "2-digit" });
      const o = d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
      el.textContent = `Ultimo aggiornamento: ${g} alle ${o}`;
    };
    const daServer = () => {   // intestazione Last-Modified inviata da GitHub Pages
      const d = new Date(document.lastModified);
      if (!isNaN(d) && Date.now() - d > 60000) scrivi(d);
    };
    const m = location.hostname.match(/^([\w-]+)\.github\.io$/);
    const repo = location.pathname.split("/").filter(Boolean)[0];
    if (!m || !repo) return daServer();
    fetch(`https://api.github.com/repos/${m[1]}/${repo}/commits?path=data/risultati.json&per_page=1`)
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(c => scrivi(new Date(c[0].commit.committer.date)))
      .catch(daServer);
  })();
})();
</script>
</body>
</html>
